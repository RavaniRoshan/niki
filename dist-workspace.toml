[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A prefix git tag must include to be published to (e.g. "v")
tag-namespace = "v"
# Whether to install an updater program
install-updater = true
# v-release.yml is hand-maintained (artifact actions pinned to v7: v8 does not
# exist for upload-artifact, and v8 downloads reject v7 uploads). Without this,
# `cargo dist` aborts on the dirty CI file instead of building the release.
allow-dirty = ["ci"]

# The terminal interface is TypeScript, so cargo cannot build it and cargo-dist would not ship it.
# It is produced by `cd shell && bun install && npm run build:binary` before the release runs, and
# attached here so it lands in the same archive as the engine. Without this the install contains
# `niki` and no way to reach the interface at all.
[dist.extra-artifacts]
shell-dist = ["shell/dist/niki-shell", "shell/dist/niki-shell.exe"]
