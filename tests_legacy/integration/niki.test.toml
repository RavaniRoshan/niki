[general]
max_revision_rounds = 3
output_dir = ".niki"

[docker]
base_image = "niki-sandbox:24.04"
extra_packages = ["node", "npm", "python3"]
memory_limit = "2g"
cpu_limit = 2.0

[providers.openai]
base_url = "http://localhost:8080"
api_key = "mock-key"
default_model = "mock-model"

[providers.anthropic]
base_url = "http://localhost:8080"
api_key = "mock-key"
default_model = "mock-model"

[agents.planner]
provider = "anthropic"
model = "mock-model"

[agents.coder]
provider = "anthropic"
model = "mock-model"

[agents.tester]
provider = "openai"
model = "mock-model"

[agents.reviewer]
provider = "anthropic"
model = "mock-model"
