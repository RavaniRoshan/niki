# niki.toml — NIKI configuration

[general]
# Maximum Reviewer → Coder feedback rounds before forced completion
max_revision_rounds = 3
# Task output directory (relative to project root)
output_dir = ".niki"
# Optional per-run spend ceiling in USD. 0.0 = unlimited (NOT recommended for
# unattended runs — set an explicit cap so a runaway loop can't burn budget).
# Hard mid-run ceiling: NIKI prints a pre-run estimate and aborts the run if the
# cumulative estimated cost exceeds this amount before executing the next stage.
spend_cap_usd = 0.0
# Optional diff-size guardrail: when non-zero, the Reviewer is nudged toward tighter
# deltas and report.md flags diffs that exceed this many added lines. 0 = off.
max_diff_lines = 0

[providers.anthropic]
api_key = "sk-ant-..."               # Or set ANTHROPIC_API_KEY env var
# base_url = "https://api.anthropic.com"  # Host/base for compatible APIs (or set ANTHROPIC_BASE_URL)
default_model = "claude-sonnet-4-20250514"  # Or set ANTHROPIC_MODEL env var

[providers.openai]
api_key = "sk-..."                    # Or set OPENAI_API_KEY env var
base_url = "https://api.openai.com/v1"  # Host/base for compatible APIs (or set OPENAI_BASE_URL)
default_model = "gpt-4o"                  # Or set OPENAI_MODEL env var

[providers.openrouter]
api_key = "sk-or-..."                 # Or set OPENROUTER_API_KEY env var
base_url = "https://openrouter.ai/api/v1"
default_model = "anthropic/claude-sonnet-4"

[providers.nvidia]
api_key = "nvapi-..."                 # Or set NVIDIA_API_KEY env var
base_url = "https://integrate.api.nvidia.com/v1"
default_model = "meta/llama-3.1-405b-instruct"

[providers.together]
api_key = "..."                       # Or set TOGETHER_API_KEY env var
base_url = "https://api.together.xyz/v1"
default_model = "meta-llama/Meta-Llama-3.1-405B-Instruct-Turbo"

[providers.groq]
api_key = "gsk_..."                   # Or set GROQ_API_KEY env var
base_url = "https://api.groq.com/openai/v1"
default_model = "llama-3.1-70b-versatile"

[providers.deepseek]
api_key = "..."                       # Or set DEEPSEEK_API_KEY env var
base_url = "https://api.deepseek.com/v1"
default_model = "deepseek-chat"

[providers.google]
api_key = "AIza..."                   # Or set GOOGLE_API_KEY env var
default_model = "gemini-2.5-pro"

[providers.ollama]
base_url = "http://localhost:11434"   # Local Ollama instance
default_model = "llama3.1"

# Per-agent model assignment (BYOK mixing)
# Each agent can use a different provider and model. This lets you optimize
# for cost, speed, and quality across the pipeline.
# Shorthands welcome: opus/sonnet/haiku (anthropic), 4o/4o-mini (openai),
# flash/pro (google) resolve to canonical ids at load. Pinned versions pass
# through untouched. Per-agent `effort = "low"|"medium"|"high"` tunes
# temperature/tokens only when max_tokens/temperature are unset.
[agents.planner]
provider = "anthropic"
model = "claude-sonnet-4-20250514"         # Best reasoning for planning
# max_tokens = 8192                        # Optional: override default
# temperature = 0.2                        # Optional: override default

[agents.coder]
provider = "anthropic"
model = "claude-sonnet-4-20250514"

[agents.tester]
provider = "groq"                          # Fast + cheap for test generation
model = "llama-3.1-70b-versatile"
# Optional: the command NIKI runs inside the sandbox to verify the change
# (e.g. "cargo test", "npm test", "pytest", "go test ./..."). When unset,
# NIKI auto-detects from the project layout. The real exit code + output are
# recorded in every run's audit trail as artifacts/test_execution.json.
# test_command = "cargo test --locked"
# Optional: mutation-testing command run after the suite (e.g. "cargo mutants",
# "mutmut run", "stryker run"). No auto-detection — set explicitly to opt in.
# A non-zero exit (surviving mutants) is recorded and blocks the branch unless
# `niki run --force` is passed, exactly like a failing suite.
# mutation_command = "cargo mutants --no-shuffle"
# Fallback providers: if Groq is rate-limited or down, try OpenRouter, then OpenAI.
# Only transient errors (429, 503, timeout, connection) trigger failover.
fallbacks = ["openrouter", "openai"]

[agents.reviewer]
provider = "nvidia"                        # Strong model for adversarial review
model = "meta/llama-3.1-405b-instruct"

# Optional: data-driven pipeline topology.
# Define your own ordered list of stages instead of the built-in
# Planner -> Coder -> Tester -> Reviewer flow. Each stage binds a role to a
# provider/model. Omit this section (or leave `stages` empty) to use the
# default wiring derived from [agents] above.
#
# [pipeline]
# max_revision_rounds = 3
# stages = [
#   { role = "planner",  provider = "anthropic", model = "claude-sonnet-4-20250514" },
#   { role = "coder",    provider = "anthropic", model = "claude-sonnet-4-20250514" },
#   { role = "tester",   provider = "openai",    model = "gpt-4o-mini" },
#   { role = "reviewer", provider = "anthropic", model = "claude-sonnet-4-20250514" },
#   # Drop a stage from the run with skip = true:
#   # { role = "tester", provider = "openai", model = "gpt-4o-mini", skip = true },
# ]

# Optional: pull extra context into the agents' prompts.
# doc_globs matches files in the project; urls are fetched (best-effort) at run time.
#
# [knowledge]
# doc_globs = ["docs/**/*.md", "README.md"]
# urls = ["https://example.com/architecture.md"]
# max_source_chars = 8000

[docker]
# Base image for agent containers. This must be the pre-baked image built from
# docker/Dockerfile (Wolfi/Chainguard base with git/node/npm/python3 bundled):
#   podman build -t niki-sandbox:24.04 -f docker/Dockerfile .
#   (or: docker build -t niki-sandbox:24.04 -f docker/Dockerfile .)
# A bare upstream image (e.g. ubuntu:24.04) lacks those tools and fails the
# sandbox's tool check at runtime.
base_image = "niki-sandbox:24.04"
# Additional packages to install in agent containers
extra_packages = ["nodejs", "npm", "python3"]
# Memory limit per container
memory_limit = "2g"
# CPU limit per container
cpu_limit = 2.0
# Disable outbound network egress (default: true for security).
# Use network_allowlist for specific domains that need egress.
network_disabled = true
# Domain allowlist for outbound network egress. Only these domains are allowed
# when network_disabled = true. Use "*" to allow all (equivalent to network_disabled = false).
# network_allowlist = ["registry.npmjs.org", "pypi.org", "crates.io"]
# Sandbox backend: "docker" (container, default) or "worktree" (git worktree + local
# process, no container runtime). Override at runtime with: niki run --backend worktree
# backend = "docker"

# MCP (Model Context Protocol) — connect to external tool servers.
# MCP tools are injected into agent prompts, extending their capabilities.
#
# [mcp]
# read_only = true  # Governance: agents can only call read-only MCP tools
# domain_allowlist = []  # Domain allowlist for web fetch tools
#
# [[mcp.servers]]
# name = "filesystem"
# type = "local"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem"]
# enabled = true
# timeout_ms = 5000
#
# Remote servers use Streamable HTTP (plain JSON or SSE replies):
# [[mcp.servers]]
# name = "docs"
# type = "remote"
# url = "https://mcp.example.com/mcp"
# enabled = false
# timeout_ms = 5000

# Permissions & trust posture for agent tool/command gates.
# [permissions]
# mode = "manual"  # manual (default) | auto | dontask | bypass. Overridable per run: niki run --permission-mode auto
# disable_worktree = false  # Governance kill-switch: true refuses the unisolated worktree backend outright
# fail_closed_headless = false  # true: headless Ask denies instead of allowing with a warning

# Per-agent effort presets (low | medium | high) — apply only when max_tokens/
# temperature are unset; explicit values always win. Example:
# [agents.tester]
# effort = "low"

# Slash-command sources: extra dirs of *.md files (project-relative or
# absolute), e.g. a committed command pack. .niki/commands/ always wins.
# [commands]
# extra_dirs = ["docs/commands"]

# Shell hooks on pipeline lifecycle events ([hooks.commands] event -> commands).
# Wired events: PreTaskStart, PostTaskStop, PreAgentStart, PostAgentStop
# (plus PreToolUse/PostToolUse inside the runtime tool loop).
# Contract per command: exit 2 (or stdout JSON {"deny": true}) BLOCKS and aborts
# the run fail-closed; anything else allows. Payload arrives via
# NIKI_HOOK_EVENT / NIKI_HOOK_PAYLOAD env vars. Unknown events warn + skip.
# [hooks.commands]
# PreTaskStart = ["echo \"starting $NIKI_HOOK_PAYLOAD\" >> .niki/hooks.log"]
# PostTaskStop = ["echo \"finished $NIKI_HOOK_PAYLOAD\" >> .niki/hooks.log"]
