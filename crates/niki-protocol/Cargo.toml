[package]
name = "niki-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "The typed wire protocol between the NIKI engine and any shell. One crate, one set of messages, exported to TypeScript so the shell cannot drift."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11.1", features = ["no-serde-warnings"] }
thiserror = "2"

[[bin]]
name = "gen-protocol-bindings"
path = "src/bin/gen_bindings.rs"