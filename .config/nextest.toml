# cargo-nextest configuration.
#
# Rationale: NIKI's suite has a documented RAM ceiling (AGENTS.md). The previous
# guidance was "always pass --test-threads=1", which serialises the ~700 cheap
# unit tests along with the handful of genuinely heavy integration binaries and
# makes the suite take far longer than it needs to.
#
# nextest lets us be precise instead: heavy binaries get max-threads = 1, the
# rest stay parallel. Process-per-test isolation also removes cross-test
# contamination through shared process state, which is a real flakiness source.
#
# The serial path must still work without nextest installed — see
# scripts/test-layer.sh, which reads the same .config/test-binary-groups list
# this file's overrides are generated from.

[profile.default]
# Retries: one transient failure should not fail a whole CI run outright.
retries = 0

# Concurrency, for a box that cannot run the whole suite twice at once.
#
# This machine is ~7.5 GiB and shares it with another agent session; the
# reported symptom is OOM kills and freezes during the suite. 2 is not a
# guess from the core count — it is the setting under which a full
# `cargo build --tests` peaked at 2.48 GB RSS. A tidier `nproc` leaves
# nothing for the other session.
test-threads = 2
# One CPU per test by default. A test that builds a git fixture or a
# worktree, next to one that measures a wall-clock render budget, starves
# the measurement; a test that genuinely wants more can say so with
# `#[nextest::thread_required(n)]` rather than the whole suite being
# conservative.
threads-required = 1
# Stop at the first failure. On a shared box a suite that keeps running
# after a failure spends the memory the next test needed.
fail-fast = true

# A test that has not finished in 90s is wedged. terminate-after gives it 30s
# more to unwind before it is killed, so a leaked child process still gets
# reaped rather than orphaned.
slow-timeout = { period = "90s", terminate-after = 30 }

# ── Heavy binaries: one test at a time ────────────────────────────────
# Membership is NOT written here — it is generated into the overrides at the
# bottom of this file from .config/test-binary-groups. A group with no overrides
# is silently empty, which is the bug tests/test_groups.rs exists to prevent.
# Heavy binaries build git fixture repos, worktrees, or measure wall-clock render
# budgets; running them concurrently starves the timing assertions and
# multiplies peak RSS.
[test-groups.heavy]
max-threads = 1

# KB + structural index tests build large in-memory indexes.
[test-groups.heap]
max-threads = 1

# ── Default for everything else ───────────────────────────────────────
[profile.ci]
retries = 1
# CI runs on bare-metal runners with the whole machine to itself, so the
# local floor does not apply there. The heavy/heap groups still serialise.
test-threads = "num-cpus"

# BEGIN generated by scripts/gen-nextest-groups.py — edit .config/test-binary-groups instead
# Source: .config/test-binary-groups. Regenerate with scripts/gen-nextest-groups.py.
# These groups are the only thing stopping a 7.5 GiB host from OOMing:
# the heavy and heap binaries run one at a time, everything else parallelises.

[[profile.default.overrides]]
filter = 'binary(tui_navigation) | binary(tui_perf) | binary(visual_layout_check) | binary(run_lifecycle) | binary(pipeline_guards) | binary(kb_pipeline) | binary(runtime_benchmarks) | binary(worktree_policy) | binary(diff_scope) | binary(sandbox_teardown) | binary(acp_server) | binary(resume_cli) | binary(hooks_lifecycle) | binary(agent_runtime)'
test-group = 'heavy'

[[profile.default.overrides]]
filter = 'binary(structural_index) | binary(kb_store) | binary(history_cache) | binary(repo_intel)'
test-group = 'heap'

# END generated by scripts/gen-nextest-groups.py
