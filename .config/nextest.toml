# nextest configuration — see research/ultimate-test-suite-niki.md Phase 1
# CI profile: retry flaky sandbox/container races but never hide them.

[profile.default]
retries = 0
slow-timeout = { period = "120s" }

[profile.ci]
retries = { backoff = "exponential", count = 2, delay = "1s", jitter = true }
flaky-result = "fail"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci.junit]
path = "target/nextest-ci/junit.xml"
