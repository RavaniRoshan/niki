# Linker choice for this box.
#
# The preference order is mold → lld → gold, and this is currently pinned to
# **gold** because that is the only fast linker actually present:
#
#   mold   — not installed
#   lld    — not installed, and `cc -fuse-ld=lld` fails outright
#   gold   — present, and `cc -fuse-ld=gold` links successfully
#
# Installing the preferred ones needs sudo, which is not available
# non-interactively here:
#
#   sudo apt-get install -y mold lld clang
#
# When `mold` is installed, change the value below to `mold` — nothing else
# needs to move. It is left pointing at something that works rather than
# something that reads well, because a linker flag naming a linker that is not
# installed does not fail: it is ignored, and the box still links with bfd and
# still runs out of memory.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=gold"]
