[package]
name = "niki"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Hermetic multi-agent coding system: isolated AI agents independently plan, code, test & review in Docker/Podman sandboxes, then hand you a reviewable git branch."
license = "Apache-2.0"
repository = "https://github.com/RavaniRoshan/niki"
homepage = "https://niki-site.vercel.app"
readme = "README.md"
authors = ["Ravani Roshan <ravani.roshan@gmail.com>"]
keywords = ["ai", "agents", "coding-agent", "multi-agent", "llm", "cli", "rust", "sandbox", "devtools", "automation"]
categories = ["command-line-utilities", "development-tools", "ai"]
exclude = ["/.github", "/assets", "/docs", "/research", "/tests", "/evals", "/bench", "/scripts", "/target", "/prompts", "/schemas", "/niki.example.toml"]

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JSON Schema validation
jsonschema = "0.29"

# Configuration
toml = "0.8"

# HTTP client (for LLM API calls)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Docker interaction
bollard = "0.18"

# Git operations
git2 = "0.20"

# Template rendering (for agent prompts)
minijinja = "2"

# Fast random number generation
fastrand = "2"

# Terminal output
console = "0.15"
indicatif = "0.17"
textwrap = "0.16"
syntect = "5"

# Rich terminal TUI
ratatui = "0.29"
unicode-truncate = "1"

# ASCII art font rendering for logo
figlet-rs = "1.0"

# UUID generation (for task IDs)
uuid = { version = "1", features = ["serde", "v4"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Embedded prompts/schemas (bundled into the binary so it works outside the source tree)
include_dir = "0.7"

# File watching / globbing
globset = "0.4"
walkdir = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async streaming for LLM responses
futures = "0.3"
tokio-stream = "0.1"
async-trait = "0.1.89"
dirs = "6.0.0"
glob = "0.3.3"
libc = "0.2"

# Text diffing for fuzzy edit matching
similar = "2"

# Markdown parsing (for chat interface)
pulldown-cmark = "0.12"

# Regex for secret redaction
regex = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
