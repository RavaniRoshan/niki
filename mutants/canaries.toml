# ── Cost / telemetry ────────────────────────────────────────────────────────

[[canary]]
id = "CT-1-accumulation-max-instead-of-sum"
file = "src/llm/provider.rs"
patch = "        self.input_tokens += step.input_tokens;"
replace_with = "        self.input_tokens = self.input_tokens.max(step.input_tokens);"
category = "cost-telemetry"
invariant = "a four-step tool loop is billed as four requests, not its largest step"
probe = "--test reverse"
scope = "integration"
expect_kill = true
split = "gate"
origin = "the tool loop and repair retry once used .max() instead of +="
#
# Targets the shared `TokenUsage::accumulate`, not a call site. An earlier
# draft pointed at `runtime/tools.rs` and the canary SURVIVED: the cost tests
# exercised a local copy of the arithmetic, so changing the call site changed
# nothing they could observe. Centralising the operation is what closed it.

[[canary]]
id = "CT-2-repair-retry-usage-dropped"
file = "src/agents/mod.rs"
patch = "                    prev.accumulate(&response.usage);"
replace_with = "                    let _ = &response.usage;"
category = "cost-telemetry"
invariant = "a repair retry is a second billable request and must be charged"
probe = "--test reverse"
scope = "integration"
expect_kill = false
known_surviving = true
split = "holdout"
origin = "a repair retry is a second billable request"
#
# HONEST ENTRY — this canary survives today, and the corpus says so.
# The repair-retry path runs inside a live stream, and no test drives a failed
# parse followed by a successful repair, so mutating that one call is
# invisible. Closing this needs an end-to-end fault: unparseable JSON on the
# first attempt, valid JSON on the retry. The `prose_not_json` and
# `valid_schema_empty_semantics` faults can already produce it once the retry
# path is driven rather than unit-tested.

