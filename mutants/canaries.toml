# Canary corpus — deliberately injected defects, each tied to a written rule.
#
# The question this file exists to answer: **does the test suite actually fail
# when the product is broken?**
#
# A harness that only reports a pass rate cannot answer it, and a suite never
# shown failing on a broken product is consistent with one that asserts
# nothing. Each entry injects one known defect; the runner records whether the
# suite noticed.
#
# Rules for adding a canary:
#
#   * Every entry maps to a WRITTEN rule (`invariant`), not to a line of code.
#   * `patch` must match exactly one site. The runner refuses otherwise, since
#     an unmatched patch scored as "survived" would quietly weaken the gate.
#   * `equivalent = true` entries are KEPT, with a reason: they document known
#     blind spots and stop the denominator being gamed by deleting hard cases.
#   * `known_surviving = true` marks a defect the suite genuinely cannot see
#     today. Recording it is the honest move; omitting it is not.
#   * The gate is computed on the HELD-OUT split alone. Optimising on the whole
#     corpus reaches ~98% in-sample and ~95% held-out, and reporting only the
#     in-sample number is how a harness ends up flattering itself.

schema = 1

# ── Pipeline logic / state ──────────────────────────────────────────────────

[[canary]]
id = "PL-1-branch-claimed-without-creation"
file = "src/cli/run.rs"
patch = "                Ok(true) => branch_created = true,"
replace_with = "                Ok(true) => branch_created = true, branch_created = true;"
category = "state-resume"
invariant = "INV-BRANCH-STATUS: a Completed run has a branch, and that branch exists on disk"
probe = "--test run_lifecycle"
scope = "integration"
expect_kill = true
split = "gate"
origin = "three separate paths recorded Completed with a branch that was never created"

[[canary]]
id = "PL-2-verdict-source-dropped"
file = "src/cli/run.rs"
patch = "    record.verdict_source = result.verdict_source.clone();"
replace_with = "    record.verdict_source = None;"
category = "state-resume"
invariant = "INV-VERDICT-NOT-FABRICATED: a verdict must name its source"
probe = "--test run_lifecycle"
scope = "integration"
expect_kill = true
split = "holdout"
origin = "the SingleAgent fast path self-approves; the record must say so"

# ── Cost / telemetry ────────────────────────────────────────────────────────

[[canary]]
id = "CT-1-accumulation-max-instead-of-sum"
file = "src/llm/provider.rs"
patch = "        self.input_tokens += step.input_tokens;"
replace_with = "        self.input_tokens = self.input_tokens.max(step.input_tokens);"
category = "cost-telemetry"
invariant = "a four-step tool loop is billed as four requests, not its largest step"
probe = "--test reverse"
scope = "integration"
expect_kill = true
split = "gate"
origin = "the tool loop and repair retry once used .max() instead of +="
#
# Targets the shared `TokenUsage::accumulate`, not a call site. An earlier
# draft pointed at `runtime/tools.rs` and the canary SURVIVED: the cost tests
# exercised a local copy of the arithmetic, so changing the call site changed
# nothing they could observe. Centralising the operation is what closed it.

[[canary]]
id = "CT-2-repair-retry-usage-dropped"
file = "src/agents/mod.rs"
patch = "                    prev.accumulate(&response.usage);"
replace_with = "                    let _ = &response.usage;"
category = "cost-telemetry"
invariant = "a repair retry is a second billable request and must be charged"
probe = "--test reverse"
scope = "integration"
expect_kill = false
known_surviving = true
split = "holdout"
origin = "a repair retry is a second billable request"
#
# HONEST ENTRY — this canary survives today, and the corpus says so.
# The repair-retry path runs inside a live stream, and no test drives a failed
# parse followed by a successful repair, so mutating that one call is
# invisible. Closing this needs an end-to-end fault: unparseable JSON on the
# first attempt, valid JSON on the retry. The `prose_not_json` and
# `valid_schema_empty_semantics` faults can already produce it once the retry
# path is driven rather than unit-tested.

# ── Sandbox / isolation ─────────────────────────────────────────────────────

[[canary]]
id = "SB-1-timeout-does-not-kill"
file = "src/sandbox/exec.rs"
patch = "    let killed = kill_group(pid).await;"
replace_with = "    let killed = true;"
category = "sandbox-isolation"
invariant = "a timed-out command leaves no orphan running"
probe = "--test exec_timeout"
scope = "integration"
expect_kill = true
split = "gate"
origin = "the deadline cancelled only the future, not the process"

