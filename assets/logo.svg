<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200"
     role="img" aria-labelledby="niki-title niki-desc">
  <title id="niki-title">NIKI</title>
  <desc id="niki-desc">The NIKI mark: four agent glyphs — a planner diamond, a coder diamond,
    a tester circle and a reviewer diamond — joined left to right in a pipeline, above the
    wordmark. The glyphs are the same four the terminal UI prints, in the Kiln palette the
    product ships.</desc>

  <!--
    Drawn from the product, not invented for a README.

    The four glyphs are the ones `niki` prints at runtime — ◈ Planner, ⟠ Coder,
    ◉ Tester, ◆ Reviewer (`src/display/logo.rs`, `src/display/theme.rs`) — and
    the four colours are `Palette::role_*` from the Kiln theme:

        Planner  #d9a86a  pale ochre
        Coder    #b85c1a  deep ember
        Tester   #6fb05c  leaf
        Reviewer #3fa396  verdigris

    The card is espresso #141211 (`Palette::bg_deep`) with a cream wordmark
    (#f3efea, `Palette::fg`), so the lockup is identical in GitHub's light and
    dark themes and needs no `prefers-color-scheme`.

    Nothing here is a font. The glyphs are paths, and so is the wordmark:
    N, I, K and I are all straight lines, and a stroked monoline wordmark needs
    no glyph outlines, no webfont and no fallback. An earlier version used
    `<text>` with `ui-monospace`, and it rendered as a stretched proportional
    face wherever `ui-monospace` was not the first match — which is exactly the
    class of difference a logo must not have.
  -->

  <rect width="340" height="200" rx="18" fill="#141211"/>
  <rect x="0.5" y="0.5" width="339" height="199" rx="17.5" fill="none" stroke="#2f2a27"/>

  <!-- ── the pipeline ──────────────────────────────────────────────── -->

  <!-- Centred in the real gaps between glyphs (105-127, 157-181, 207-231),
       not in the gaps between evenly-spaced cells: the diamond ends at 105 and
       the next begins at 127, so the midpoint is 116. -->
  <g stroke="#574d47" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M110 58 H118"/>
    <path d="M163 58 H171"/>
    <path d="M213 58 H221"/>
  </g>
  <g fill="#574d47">
    <path d="M121 54 L126 58 L121 62 Z"/>
    <path d="M174 54 L179 58 L174 62 Z"/>
    <path d="M224 54 L229 58 L224 62 Z"/>
  </g>

  <!-- Planner ◈ — a diamond within a diamond -->
  <polygon points="90,45 105,58 90,71 75,58" fill="none" stroke="#d9a86a" stroke-width="3"
           stroke-linejoin="round"/>
  <polygon points="90,51.5 96.5,58 90,64.5 83.5,58" fill="#d9a86a"/>

  <!-- Coder ⟠ — a diamond crossed -->
  <g stroke="#b85c1a" stroke-width="3" stroke-linecap="round" fill="none">
    <polygon points="142,45 157,58 142,71 127,58" stroke-linejoin="round"/>
    <path d="M136.5 52.5 L147.5 63.5"/>
    <path d="M147.5 52.5 L136.5 63.5"/>
  </g>

  <!-- Tester ◉ — a fisheye: a ring with an inner disc -->
  <circle cx="194" cy="58" r="13" fill="none" stroke="#6fb05c" stroke-width="3"/>
  <circle cx="194" cy="58" r="5" fill="#6fb05c"/>

  <!-- Reviewer ◆ — a solid diamond, the only one that needs no reading -->
  <polygon points="246,45 261,58 246,71 231,58" fill="#3fa396"/>

  <!-- ── the wordmark, stroked ─────────────────────────────────────── -->

  <!-- Centred by the letters' visual bounds, not by their cells. The two I
       glyphs are single stems, so a run centred on cell pitch sits about 8px
       left of the card's centre; the bounds here run 97 → 242, midpoint
       169.5 against a card centre of 170. Cap height 44, stroke 8. -->
  <g stroke="#f3efea" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- N -->
    <path d="M97 140 V100"/>
    <path d="M97 100 L123 140"/>
    <path d="M123 100 V140"/>

    <!-- I -->
    <path d="M154 100 V140"/>

    <!-- K -->
    <path d="M185 100 V140"/>
    <path d="M211 100 L185 120"/>
    <path d="M185 120 L211 140"/>

    <!-- I -->
    <path d="M242 100 V140"/>
  </g>

  <!-- the pipeline, named, so the mark reads without the glyphs -->
  <!-- The pipeline again, in the palette: one dot per stage, each under its own
       glyph and in that stage's colour. An earlier version put three empty
       circles on a rule, which is decoration that means nothing. -->
  <path d="M70 168 H270" stroke="#3a332f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <circle cx="90"  cy="168" r="5" fill="#d9a86a"/>
  <circle cx="142" cy="168" r="5" fill="#b85c1a"/>
  <circle cx="194" cy="168" r="5" fill="#6fb05c"/>
  <circle cx="246" cy="168" r="5" fill="#3fa396"/>
</svg>
