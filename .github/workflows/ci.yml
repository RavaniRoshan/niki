name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: Build binary
        run: go build -o bin/niki ./cmd/niki
      - name: Test (race)
        run: go test ./... -race
      - name: PTY end-to-end
        run: |
          go build -o bin/niki ./cmd/niki
          NIKI_PTY_TESTS=1 go test ./cmd/niki/ -run 'PTY|NonTTY' -v
      - name: Fuzz (short)
        run: |
          go test -run=Fuzz -fuzz=FuzzAnalyzeShell -fuzztime=10s ./internal/permissions/
          go test -run=Fuzz -fuzz=FuzzParseSkill -fuzztime=10s ./internal/skills/
      - name: Benchmarks (compile + smoke)
        run: go test -bench=. -benchtime=10x ./internal/tui/
