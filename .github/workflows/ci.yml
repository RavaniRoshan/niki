name: CI

on:
  workflow_dispatch:
    inputs:
      # The visual render is environment-dependent: the same binary and the
      # same DejaVu Sans Mono produce materially different pixels on this
      # runner than on a developer machine. Blessing references locally and
      # pushing them left every frame still failing, by 6.6% to 9.4%. So they
      # have to be blessed *here*, and a human reviews them before committing.
      #
      # This lives at workflow level because `workflow_dispatch` is a trigger,
      # not a job key. I first wrote it inside the `visual:` job, where PyYAML
      # accepted it and GitHub rejected the whole file — so `ci.yml` produced
      # no jobs at all and the pull_request run stopped being created. The
      # failure surfaced as a 0-second "workflow file issue" on push runs.
      regen:
        description: "Re-bless the visual reference frames on this runner"
        type: boolean
        default: false
  push:
    branches: [master, "goal/**"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Runner: GitHub-hosted ──────────────────────────────────────────
  #
  # Blacksmith was tried here and rejected on evidence, not taste:
  #
  # * The app is installed on `Roshan-s-labs` with full `actions: write`, not
  #   suspended — so the labels resolved correctly and the workflow was
  #   scheduled. But after ~6 minutes only ONE of twelve Linux jobs had picked
  #   up a runner and the other eleven sat queued. Blacksmith provisions
  #   runners per job, and at that concurrency this workflow would take longer
  #   than the 13m21s it takes on GitHub-hosted runners. Faster hardware
  #   behind a serialisation point is slower.
  # * With the runner label written in *before* the app existed, nothing ran
  #   at all: a workflow whose labels match no runner is not scheduled, so the
  #   audit, the install-path gate and the fast checks all went silent.
  #
  # Revisit if Blacksmith's concurrency on this account changes. The change
  # is one line per job plus a `CI_RUNNER` repository variable; the reasoning
  # is recorded here so the next person does not re-run the experiment.
  #
  # The `Swatinem/rust-cache@v2` and `actions/setup-node@v7` steps are load
  # bearing and must not be dropped: a cold `cargo build --tests` compiles
  # vendored libgit2 on every job, so removing the cache makes every run a cold
  # build regardless of how fast the runner is.

  # ── Phase 1: Fast checks (fail fast) ──────────────────────────────
  check:
    name: Check (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runs before anything expensive, because it is the check that decides
      # whether the rest of the gates are real.
      #
      # Branch protection is a list of *strings*. GitHub blocks a merge when a
      # required check has not reported, and it does not care whether that
      # check still exists — so a job renamed here leaves a required name
      # behind that can never report, and every pull request in the repository
      # is blocked from then on with "waiting for status check" and no reason.
      # Nothing in the workflow file shows that, because the list lives in the
      # repository's settings.
      - name: Required status checks still exist
        run: python3 scripts/check-required-contexts.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy lints (fatal)
        run: cargo clippy --all-targets -- -D warnings

  # ── Phase 1-msrv: Minimum Supported Rust Version (1.88) ─────────────
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV build
        run: cargo check --all-targets

  # ── Phase 1-features: Build without default features ────────────────
  no-default-features:
    name: Build (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - name: Build without default features
        run: cargo build --no-default-features

  # ── Phase 1b: Supply-chain audit (cargo-audit + cargo-deny) ────────
  audit:
    name: Audit (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - name: Cache cargo-audit and cargo-deny
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: cargo-audit-deny-v1
      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
      - name: Run cargo-audit (RustSec advisories)
        run: cargo audit
      - name: Install cargo-deny
        run: command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked
      - name: Run cargo-deny (advisories + licenses + sources)
        run: cargo deny check

  # ── Phase 1c: Release-manifest URL liveness ─────────────────────────
  # Manifests may legitimately lag Cargo.toml (they track the latest release
  # *with uploaded assets*), but their URLs must never 404. v0.6.0 shipped a
  # tag without assets while manifests pointed at v0.4.0 — this job pins that
  # invariant: every download URL referenced by a manifest must exist.
  manifest-parity:
    name: Manifest parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check manifest download URLs resolve
        run: |
          set -euo pipefail
          # Both archive extensions dist actually publishes. This grepped for
          # `.tar.gz` alone, which no manifest has contained since the
          # install-path fix moved Homebrew to `.tar.xz` — so the job had been
          # checking only the Windows .zip URLs and reporting success while
          # four of the six release URLs went unverified.
          urls=$(grep -rhoE 'https://github\.com/[^ "]*\.(tar\.gz|tar\.xz|zip)' homebrew/ scoop/ winget/)
          echo "$urls"
          fail=0
          for u in $urls; do
            # Skip scoop autoupdate templates (contain $version).
            case "$u" in
              *'$'*) echo "SKIP(template) $u"; continue ;;
            esac
            if curl -fIsS --max-time 30 "$u" -o /dev/null; then
              echo "OK   $u"
              continue
            fi
            # A 404 on an asset is only a manifest bug if the release it names
            # actually exists. A release-preparation branch legitimately points
            # at a version whose tag has not been pushed yet, and treating that
            # as a dead link makes every version bump fail CI until the tag
            # lands — which is backwards.
            #
            # So distinguish the two: if the release tag is published, a
            # missing asset is a real failure and stays one. If the tag does
            # not exist, the URL is not wrong yet, just early.
            tag=$(echo "$u" | sed -n 's|.*/releases/download/\([^/]*\)/.*|\1|p')
            if [ -n "$tag" ] && curl -fIsS --max-time 30 \
                 "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" -o /dev/null; then
              echo "DEAD $u  (release $tag exists but the asset does not)"; fail=1
              continue
            fi
            # The tag is missing. Whether that is a bug or merely early depends
            # on something the job can actually check: has this repository
            # already declared that version shipped?
            #
            # It had, and the job called it PENDING anyway. Cargo.toml said
            # 0.9.0, CHANGELOG.md published `[0.9.0] - 2026-09-27`, and three
            # package manifests pointed at releases/download/v0.9.0 — while the
            # newest published release was v0.8.0. So `brew install niki`, the
            # headline install command in the README, 404'd, and this job was
            # green. "Not wrong yet, just early" was doing a lot of work.
            ver="${tag#v}"
            crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            changelog_says_shipped=$(grep -cE "^## \[$ver\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || true)
            if [ "$ver" = "$crate" ] || [ "${changelog_says_shipped:-0}" -gt 0 ]; then
              echo "UNPUBLISHED $u  (this repo already declares $ver released: crate=$crate, changelog entries=$changelog_says_shipped)"
              fail=1
            else
              echo "PENDING $u  (release $tag is not published yet and $ver is not declared released)"
            fi
          done
          exit $fail
      - name: Flag crate/manifest version skew (informational)
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "crate=$crate scoop=$(python3 -c "import json; print(json.load(open('scoop/niki.json'))['version'])")"
          echo "If crate is ahead of manifests, the release workflow not uploading assets is the gap to fix, not the manifests."

  # ── Phase 2: Unit + integration tests ─────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [check, msrv, no-default-features]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
      # nextest gives per-test process isolation (a real flakiness source when
      # tests share process state) plus the test-groups in .config/nextest.toml
      # that keep the heavy binaries serialized without flattening the rest.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run unit + integration tests
        run: cargo nextest run --profile ci
      - name: Build release binary
        run: cargo build --release
      - name: Verify binary runs
        run: |
          ./target/release/niki --version
          ./target/release/niki --help

  # ── Phase 2b: the documented install path must actually work ─────
  # The README and the marketing site both advertise a one-line installer.
  # It shipped requesting `.tar.gz`/`checksums.txt` when dist publishes
  # `.tar.xz`/`sha256.sum`, matching a checksum regex that could not match
  # dist's BSD-style `*name` lines, and assuming a flat archive when dist
  # nests the binary under `niki-<target>/`. A stranger could not install
  # niki at all. This job is the gate that keeps it working.
  install:
    name: Install path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install the version the package managers name
        # This used to install "${TAG:-v0.8.0}". `TAG` is set nowhere in the
        # workflow, so the fallback always won: the job installed a release from
        # before last, ran --version on it, and went green. It could not fail,
        # because the version it tested was not the version anyone installs.
        #
        # What a user gets comes from the manifests. So that is what this
        # installs — read out of scoop/niki.json, which every other manifest is
        # asserted to agree with (tests/dist_install.rs). If the manifests point
        # at a release that does not exist, the job says so out loud and says
        # the install path is therefore untested, rather than quietly passing
        # against an older version.
        id: install
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open("scoop/niki.json"))["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "installed=false" >> "$GITHUB_OUTPUT"
          if ! gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning title=install path untested::$version is not released yet, so there is nothing published to install and the one-line installer is NOT being verified against the version this branch will become. Tag and push $version to close this."
            exit 0
          fi
          export INSTALL_DIR="$RUNNER_TEMP/niki-bin"
          mkdir -p "$INSTALL_DIR"
          bash scripts/install.sh --version "$version" --install-dir "$INSTALL_DIR"
          echo "installed=true" >> "$GITHUB_OUTPUT"
      - name: The installed binary must run, and be the version we asked for
        if: steps.install.outputs.installed == 'true'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/niki-bin/niki" --version
          "$RUNNER_TEMP/niki-bin/niki" --help

  # ── Phase 2c: release-packaging contract ──────────────────────────
  dist-contract:
    name: Release packaging contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - name: Installer / formula / dist-config agreement
        run: cargo test --test dist_install --verbose
      - name: User-facing claims match the code
        run: cargo test --test claims --verbose

  # ── Phase 3: Multi-platform build verification ────────────────────
  build-matrix:
    name: Build ${{ matrix.target }}
    # `needs: [check]`, not `needs: test`.
    #
    # This is the one `needs: test` that was on the *critical path*: its output
    # feeds validate-intel-mac, so the chain was
    #   check -> test -> build-matrix -> validate-intel-mac
    # and every one of those jobs builds a release binary from cold. Relaxing
    # this first link takes the whole 7-minute `test` job off the end of the
    # run. `check` still gates it, so a tree that does not compile does not
    # spend three runners building binaries that cannot exist.
    needs: [check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
        with:
          # The cross-compiled legs must not share a key with the host build:
          # they produce a different `target/` and would evict each other.
          shared-key: ${{ runner.os }}-${{ matrix.target }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: niki-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/niki

  # ── Phase 4: End-to-end pipeline test with mock LLM ───────────────
  e2e-mock:
    name: E2E Pipeline (Mock LLM)
    # `needs: [check]`, not `needs: test` — same reasoning as `visual` and
    # `product-verify`: this job builds its own release binary and runs its own
    # mock LLM, so nothing from the `test` job reaches it.
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Build release
        run: cargo build --release
      - name: Start mock LLM
        run: |
          python3 tests/integration/mock_llm.py > /tmp/mock_llm.log 2>&1 &
          echo $! > /tmp/mock_pid
          # Previously this loop fell through silently when the server never
          # came up, so every later step failed against a dead port with a
          # misleading error. A mock that is not ready is a hard error.
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: mock LLM server did not become healthy on :8080 after 20s"
            cat /tmp/mock_llm.log || true
            exit 1
          fi
      - name: Prepare test project
        run: |
          export TEST_DIR=$(mktemp -d)
          cd $TEST_DIR
          git init
          git config user.email "ci@niki.dev"
          git config user.name "CI"
          echo 'console.log("hello");' > index.js
          echo 'node_modules/' > .gitignore
          git add . && git commit -m "initial"
          cp ${{ github.workspace }}/tests/integration/niki.test.toml niki.toml
          echo "TEST_DIR=$TEST_DIR" >> $GITHUB_ENV
      - name: Run pipeline
        run: |
          ./target/release/niki run 'Add health endpoint' \
            --backend worktree --quiet --project $TEST_DIR
      # Was two `echo`s: green whether or not the pipeline produced anything.
      - name: Verify artifacts
        run: |
          set -euo pipefail
          echo "=== Branches ==="
          git -C "$TEST_DIR" branch
          echo "=== .niki contents ==="
          find "$TEST_DIR/.niki" -type f 2>/dev/null | sort

          BRANCH="$(git -C "$TEST_DIR" branch --list 'niki/*' | tr -d ' *' | head -1)"
          if [ -z "$BRANCH" ]; then
            echo "FAIL: the run created no niki/* branch"
            exit 1
          fi

          TASKDIR="$(find "$TEST_DIR/.niki/tasks" -maxdepth 1 -mindepth 1 -type d | head -1)"
          if [ -z "$TASKDIR" ]; then
            echo "FAIL: no task directory under $TEST_DIR/.niki/tasks"
            exit 1
          fi
          for f in changes.patch report.md task.json; do
            if [ ! -s "$TASKDIR/$f" ]; then
              echo "FAIL: $TASKDIR/$f is missing or empty"
              exit 1
            fi
          done
          if ! grep -q 'diff --git' "$TASKDIR/changes.patch"; then
            echo "FAIL: changes.patch contains no unified diff"
            exit 1
          fi
          echo "ok: branch $BRANCH + non-empty changes.patch, report.md, task.json"
      - name: Cleanup
        if: always()
        run: kill $(cat /tmp/mock_pid 2>/dev/null) 2>/dev/null || true

  # ── Phase 2d: headless PTY TUI gate ───────────────────────────────
  # tests/headless_tui.py drives the real `niki chat` binary under a real
  # pseudo-terminal and asserts on the rendered cell grid: mouse scroll,
  # click-to-position, the scrollbar, kill-ring yank, undo, multi-line input,
  # slash commands, the command palette, the status bar. It was written, worked,
  # and was never wired to anything — 11 passing tests nobody ran.
  tui-headless:
    name: Headless PTY TUI (${{ matrix.colour }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Both colour states, as separate jobs on separate runners — not as two
    # invocations in one job. The suite is timing-sensitive by construction:
    # every test ends in `wait_for_stable`, so it fails when the machine is
    # loaded. Running it twice back-to-back in one job doubled that load and
    # turned a strict gate into a flaky one, which is the opposite of what it
    # was for. Separate runners give each state a clean machine.
    strategy:
      fail-fast: false
      matrix:
        include:
          - colour: "NO_COLOR=1"
            label: "no colour"
          - colour: "colour"
            label: "truecolor"
    env:
      # `colour` runs the suite with NO_COLOR explicitly removed; `NO_COLOR=1`
      # sets it. The Rust suite learned this the hard way: a shimmer test
      # passed only because a developer's shell exported NO_COLOR, and the same
      # env-dependence then hid a TUI that repainted forever and could never be
      # waited on. The Python suite had the same blind spot.
      FORCE_NO_COLOR: ${{ matrix.colour == 'NO_COLOR=1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "tuiwright==0.2.1" pytest pytest-asyncio
      - name: Build release binary
        run: cargo build --release
      - name: Run headless PTY suite
        # One invocation, and the vacuity check reads the SAME run.
        #
        # This ran the whole suite twice per job — once with -v for the log and
        # once with -q into /tmp/tui.txt purely to grep it for "N passed". The
        # suite is timing-sensitive by construction (every test ends in
        # `wait_for_stable`, so it fails when the machine is loaded), so the
        # second run doubled the load on the one job whose failures are hardest
        # to tell from flakiness. Two full runs, four jobs, for a string match.
        #
        # `tee` keeps the verbose output in the log and the summary on disk;
        # `|| true` so the vacuity check below — not the pipeline's exit status —
        # is what decides, which is what it was for.
        run: |
          set -euo pipefail
          if [ "$FORCE_NO_COLOR" = "true" ]; then
            NO_COLOR=1 python3 -m pytest -c pytest_headless.ini -v 2>&1 | tee /tmp/tui.txt || true
          else
            env -u NO_COLOR python3 -m pytest -c pytest_headless.ini -v 2>&1 | tee /tmp/tui.txt || true
          fi
      - name: Fail if the whole suite was skipped
        # A dependency problem must not present as a green TUI gate. This reads
        # the run the previous step already performed.
        run: |
          set -euo pipefail
          grep -qE '[0-9]+ passed' /tmp/tui.txt || {
            echo "FAIL: no headless TUI test passed — the gate must not pass vacuously"
            tail -30 /tmp/tui.txt
            exit 1
          }

  # ── Consumer journeys ────────────────────────────────────────────────
  # The other suites test modules. This runs the real binary the way a person
  # would: on a throwaway HOME with no inherited config, no provider key, and
  # a scrubbed environment. A journey that cannot run is recorded as skipped
  # and fails the job unless it is explicitly allow-listed — this repo has
  # already shipped CI jobs that went green while executing nothing.
  journeys:
    name: Consumer journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Run consumer journeys
        run: cargo test --test journeys --verbose -- --nocapture --test-threads=1

  # ── Real-PTY TUI gate ────────────────────────────────────────────────
  # tests/headless_tui.py drives the shipped binary under a real pseudo
  # terminal and reads the rendered cell grid back. It is the only layer that
  # can catch a key bound in the table but never dispatched — and it caught
  # exactly that: `tui.rs` has two event loops, and the one `niki chat` uses
  # never reached the navigation handler, so arrows and digit jumps were
  # advertised in the footer and did nothing. Every other suite passed.
  tui-pty:
    name: Real PTY TUI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PTY test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -r requirements-dev.txt
      - name: Build release binary
        run: cargo build --release
      - name: Drive the real TUI under a PTY
        # One run, `tee`d, and the vacuity check below reads it. This used to
        # invoke the suite twice — once with `-v` for the log and once with
        # `-q` into a file purely to grep it — on a suite that fails when the
        # machine is loaded.
        env:
          NIKI_BIN: ${{ github.workspace }}/target/release/niki
        run: python3 -m pytest -c pytest_headless.ini -v 2>&1 | tee /tmp/pty.txt || true
      - name: Fail if the suite collected nothing
        # tuiwright is imported with importorskip, so a missing dependency
        # turns the whole file into a skip and the job goes green having
        # tested nothing — the same trap this repo has hit twice.
        #
        # The pattern is unanchored on purpose: `-v` wraps its summary in a
        # `====` rule, so `^[0-9]+ passed` matches nothing and would fail a
        # suite with 17 passing tests. tests/ci_contracts.rs pins this.
        run: |
          set -euo pipefail
          grep -qE '[0-9]+ passed' /tmp/pty.txt || {
            echo "FAIL: no PTY test passed — tuiwright is probably missing"
            tail -30 /tmp/pty.txt
            exit 1
          }

  # ── The demo a stranger will actually run ──────────────────────────────
  # `scripts/demo.sh` is the first-run experience: no API key, no container
  # runtime, four real agents, a real branch. It is also the easiest thing in
  # this repo to break silently — the scripted model server, the fixture's exact
  # contents, the provider wiring, the worktree backend's tool preflight, and
  # the exit code all have to line up, and nothing else in CI touches most of
  # them. A demo that stops working is worse than no demo: the first person to
  # try the product is the person who finds out.
  demo:
    name: Demo (no key, no container)
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Build release binary
        run: cargo build --release
      - name: Run the demo end to end
        # --keep: without it the script deletes the scratch project on exit,
        # and the check below has nothing to inspect.
        run: ./scripts/demo.sh --keep
      - name: The demo's branch must contain a real change
        # The demo exits non-zero when no branch is produced, but a branch with
        # an empty diff would pass that. The point of the demo is handing the
        # user something to read.
        run: |
          set -euo pipefail
          demo_dir="$(ls -dt /tmp/tmp.*/demo-project 2>/dev/null | head -1)"
          if [ -z "$demo_dir" ]; then
            echo "FAIL: the demo left no project behind, so there is nothing to check"
            exit 1
          fi
          branch="$(git -C "$demo_dir" branch --format='%(refname:short)' --list 'niki/*' | head -1)"
          if [ -z "$branch" ]; then
            echo "FAIL: the demo produced no niki/* branch"
            exit 1
          fi
          stat="$(git -C "$demo_dir" diff --stat "master...$branch" | tail -1)"
          echo "branch: $branch"
          echo "change: $stat"
          case "$stat" in
            *insertion*) ;;
            *) echo "FAIL: the demo's branch contains no insertions — the agent changed nothing"; exit 1 ;;
          esac

  # ── Does the code the agent writes actually work? ──────────────────────
  # Every other gate in this file checks that NIKI produced *artifacts of the
  # right shape*. None of them check that the code does anything. A harness
  # that emits a perfectly-formed patch which does not compile is
  # indistinguishable from one that works, right up until a person tries it —
  # and a person trying it is the thing this product exists for.
  #
  # So this job runs the whole user path against a real HTTP server on a real
  # socket, against a fixture whose test suite is red before the run and must
  # be green after, and then checks the branch out and runs those tests
  # against the code NIKI wrote.
  #
  # Against the *scripted* server, not a real model. The plumbing is what CI
  # can decide; the model's judgement is not, and a gate that goes red 40% of
  # the time on a small model is a gate everyone learns to ignore. The
  # real-model leg is `.github/workflows/mega-e2e.yml`, on demand.
  mega-e2e:
    name: Mega E2E (code must work)
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The pipeline's sandbox preflight requires git, node, npm and python3
      # on the host, and the fixture's own tests need pytest. Without these
      # the run fails in a way that has nothing to do with the thing under
      # test — which is how a product gate becomes a mystery gate.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install test dependencies
        run: python3 -m pip install --quiet pytest
      - name: Build release binary
        run: cargo build --release
      - name: The gate must be able to fail
        # Before anything else, and for a reason that has nothing to do with
        # speed: a check that has only ever been green is not known to be a
        # check. This runs the mega leg against a stand-in binary that
        # produces a plausible patch which does not work, a run that hands
        # back nothing, and a report that admits it is unverified — and the
        # leg has to reject all three.
        #
        # It is the only part of this file that can be red without anything
        # being wrong with the product, and that is the point: it is what
        # makes the green run below mean something.
        run: ./scripts/mega-e2e-selftest.sh
      - name: Start the scripted model server
        env:
          MOCK_LLM_PORT: "8091"
          MOCK_LLM_SCRIPT: ${{ github.workspace }}/tests/integration/script_median.json
        run: |
          set -euo pipefail
          python3 tests/integration/mock_llm.py >/tmp/mock.log 2>&1 &
          echo $! >/tmp/mock.pid
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8091/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: the scripted server never became ready"
            cat /tmp/mock.log
            exit 1
          fi
          # The script must exist and have loaded, or the run silently
          # answers with the built-in JavaScript story and every check below
          # fails for a reason that has nothing to do with the product.
          grep -q 'scripted:' /tmp/mock.log || { echo "FAIL: MOCK_LLM_SCRIPT was not loaded"; cat /tmp/mock.log; exit 1; }
      - name: Run the whole product end to end
        env:
          NIKI_BIN: ${{ github.workspace }}/target/release/niki
          NIKI_BASE_URL: http://127.0.0.1:8091
          NIKI_MODEL: mock-model
          NIKI_PROVIDER: openai
          NIKI_MEGA_TIMEOUT: "600"
        run: ./scripts/mega-e2e.sh
      - name: Cleanup
        if: always()
        run: kill $(cat /tmp/mock.pid 2>/dev/null) 2>/dev/null || true

  # ── Windows ──────────────────────────────────────────────────────────
  # niki ships a winget manifest and a cargo-dist `x86_64-pc-windows-msvc`
  # target, but no workflow ever built or ran anything on Windows. A manifest
  # nobody builds is a manifest that breaks silently at release time, and the
  # platform differences that matter here (PTY behaviour, path handling,
  # `kill_on_drop`) are exactly the ones a Linux runner cannot exercise.
  windows:
    name: Windows (build + smoke)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Build release
        run: cargo build --release
      - name: Verify binary runs
        shell: pwsh
        run: |
          .\target\release\niki.exe --version
          .\target\release\niki.exe --help
      - name: Verify the installer script parses
        shell: pwsh
        run: |
          # The POSIX installer is not runnable here, but a CRLF/encoding
          # regression in the repo would be caught before it reaches a user.
          bash -n ./scripts/install.sh

  # ── Phase 4b: Visual regression gate (VHS reference frames) ──────────
  visual:
    name: Visual regression (VHS)
    # `needs: [check]`, not `needs: test`. This job captures VHS frames from a
    # release binary it builds itself and compares them to the reference set —
    # it consumes no test output. Gating it behind `test` turned an 8-minute
    # capture job into a 15-minute one and put the most expensive TUI gate at
    # the very end of the run. `check` still gates it.
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NIKI_CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - name: Install VHS + fonts + PIL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          curl -fsSL -o /tmp/vhs.deb https://github.com/charmbracelet/vhs/releases/download/v0.10.0/vhs_0.10.0_amd64.deb
          sudo dpkg -i /tmp/vhs.deb
          # VHS renders tapes through ttyd, which is not preinstalled.
          sudo curl -fsSL -o /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd
          python3 -m pip install --quiet --break-system-packages pillow
          vhs --version
          ttyd --version
      - name: Build release
        run: cargo build --release
      - name: Capture + compare reference frames
        run: |
          if [ "${{ inputs.regen }}" = "true" ]; then
            REGEN=1 ./tests/visual/run.sh
          else
            ./tests/visual/run.sh
          fi
      - name: Upload re-blessed frames for review
        if: ${{ inputs.regen }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-reference-frames
          path: tests/visual/reference/*.png
          retention-days: 14
      - name: Upload frames on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-frames
          path: tests/visual/frames/
          retention-days: 14

  # ── Phase 5: Validate the cross-compiled x86_64 binary on real Intel ──
  validate-intel-mac:
    name: Validate x86_64 on Intel Mac
    needs: build-matrix
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Download prebuilt x86_64-apple-darwin binary
        uses: actions/download-artifact@v7
        with:
          name: niki-x86_64-apple-darwin
          path: intel-bin
      - name: Smoke test (version + help)
        run: |
          chmod +x intel-bin/niki
          intel-bin/niki --version
          intel-bin/niki --help
      - name: Start mock LLM
        run: |
          python3 tests/integration/mock_llm.py &
          echo $! > /tmp/mock_pid
          for i in $(seq 1 20); do
            curl -s http://localhost:8080/health > /dev/null 2>&1 && break
            sleep 0.5
          done
      - name: Prepare test project
        run: |
          export TEST_DIR=$(mktemp -d)
          cd $TEST_DIR
          git init
          git config user.email "ci@niki.dev"
          git config user.name "CI"
          echo 'console.log("hello");' > index.js
          echo 'node_modules/' > .gitignore
          git add . && git commit -m "initial"
          sed 's|base_url = "http://localhost:8080"|base_url = "http://localhost:8080"|' \
            ${{ github.workspace }}/tests/integration/niki.test.toml > niki.toml
          echo "TEST_DIR=$TEST_DIR" >> $GITHUB_ENV
      - name: Run pipeline on Intel binary
        run: |
          intel-bin/niki run 'Add health endpoint' \
            --backend worktree --quiet --project $TEST_DIR
      - name: Verify artifacts
        run: |
          echo "=== Branches ==="
          git -C $TEST_DIR branch
          echo "=== .niki contents ==="
          find $TEST_DIR/.niki -type f 2>/dev/null
      - name: Cleanup
        if: always()
        run: kill $(cat /tmp/mock_pid 2>/dev/null) 2>/dev/null || true
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: product-verify-artifacts
          path: |
            /tmp/test-project/.niki/
            tests/visual/frames/
          retention-days: 14

  # ── Phase 6: Full Product Acceptance Suite ───────────────────────
  product-verify:
    name: Product Acceptance Suite
    # `needs: [check]`, not `needs: test`.
    #
    # This job proves the *product* works: the real binary, the real TUI, real
    # consumer journeys. It does its own release build and its own product
    # scenarios, so it consumes nothing that `test` produces. Gating it behind
    # `test` put 7 minutes of testing in front of a job that then re-ran fmt,
    # clippy --all-targets and the whole suite again (that duplication is gone
    # from product-verify.sh; see NIKI_VERIFY_FULL there).
    #
    # The cost of relaxing this is runner-minutes on a PR whose tests fail —
    # the fleet does a little work it did not have to. The benefit is that the
    # product gate, which is the one that catches a broken TUI, stops queueing
    # behind a 7-minute test job. `check` still gates it, so an obviously broken
    # tree does not spend the minutes.
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo registry + compiled dependencies. `git2` uses vendored-libgit2, so a
      # cold build pays a full C compile of libgit2 — and a dozen jobs in this
      # workflow each build the workspace from scratch on their own runner, every run.
      #
      # Keyed per job on purpose. A `shared-key` across the release builders would let
      # eight jobs write the same ~2 GB `target/release` and evict each other, which
      # is slower than no cache at all. Per-job is correct without being clever;
      # sharing is a further win once the repo's cache budget is known.
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core python3-pip
          curl -fsSL -o /tmp/vhs.deb https://github.com/charmbracelet/vhs/releases/download/v0.10.0/vhs_0.10.0_amd64.deb
          sudo dpkg -i /tmp/vhs.deb
          sudo curl -fsSL -o /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd
          python3 -m pip install --quiet --break-system-packages pillow pytest tuiwright
      - name: Prove the integrity gate can fail
        # The acceptance suite asserts the product leaves a real branch, a real
        # commit, and an unmoved starting branch. An assertion that has never
        # rejected anything is indistinguishable from the bare `pass_test` line
        # it replaced, so the gate is run against six deliberately broken
        # repositories and each rejection is required. Seconds, no LLM, no
        # container — and it is the only thing standing between this job and a
        # green tick that means nothing.
        run: bash tests/product/runners/run_scenarios_selftest.sh
      - name: Prove the documentation gate can fail
        # Same argument, applied to the claims gate. docs/launch-audit.md
        # described version 0.4.0 for six weeks and five releases while the
        # claims gate covered three filenames and never read it. Widening the
        # gate is the fix; this is what proves the fix works, by injecting each
        # class of defect the gate exists to catch and requiring a failure every
        # time. It mutates working-tree copies and restores them.
        run: bash tests/docs_consistency_selftest.sh
      - name: Handover starter is unsolved
        # niki-starter is what a newcomer is handed: a real project with a real
        # failing test, and one command. The obvious way to "tidy this up" is to
        # solve the task — and then every student run starts from green and
        # teaches nothing. Solving it is a regression, and this is the check
        # that says so.
        run: bash niki-starter/selftest.sh
      - name: Run Product Verification
        run: ./scripts/product-verify.sh
