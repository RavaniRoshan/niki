name: Integration Test

on:
  push:
    branches: [master, "goal/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  integration-mock-pipeline:
    name: Mock LLM Pipeline
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build release binary
        run: cargo build --release

      - name: Start mock LLM server
        run: |
          python3 tests/integration/mock_llm.py &
          MOCK_PID=$!
          echo $MOCK_PID > /tmp/mock_pid
          # This loop used to fall through silently when the server never came
          # up, leaving the following steps to fail against a dead port. A
          # mock that is not ready is a hard error.
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: mock LLM server did not become healthy on :8080 after 20s"
            cat /tmp/mock_llm.log 2>/dev/null || true
            exit 1
          fi
          echo "Mock server ready"

      - name: Prepare test project
        run: |
          mkdir -p /tmp/test-project
          cd /tmp/test-project
          git init
          git config user.email "test@niki.dev"
          git config user.name "Test"
          # The Coder artifact the mock returns searches for this exact line.
          # It used to be `# Test App`, which the mock's SEARCH block cannot
          # match, so the patch never applied: the run warned, the repair
          # warned, the solo path still set `verdict = Approved`, and the job
          # went green having verified... something. The fail-closed change
          # turned that into a hard error, which is how it was found.
          echo 'console.log("hello");' > index.js
          echo 'node_modules/' > .gitignore
          git add . && git commit -m "initial"
          cp ${{ github.workspace }}/tests/integration/niki.test.toml /tmp/test-project/niki.toml

      - name: Run full pipeline (Planner → Coder → Tester → Reviewer)
        id: pipeline
        run: |
          cd /tmp/test-project
          /home/runner/work/niki/niki/target/release/niki run \
            'Add a health check endpoint that returns {status: ok}' \
            --backend worktree \
            --quiet \
            --project /tmp/test-project
        env:
          MOCK_LLM_PORT: 8080

      # This step used to be pure `echo`/`cat ... || echo "No report.md"`, which
      # is green whether or not the pipeline produced anything, and its
      # `=== Exit code: $? ===` read the previous echo's status rather than the
      # run's. It now asserts the run's actual deliverables.
      - name: Verify pipeline artifacts
        run: |
          set -euo pipefail
          PROJ=/tmp/test-project

          echo "=== Git branches ==="
          git -C "$PROJ" branch

          # 1. A niki/* branch must exist and be checked out-able.
          BRANCH="$(git -C "$PROJ" branch --list 'niki/*' | tr -d ' *' | head -1)"
          if [ -z "$BRANCH" ]; then
            echo "FAIL: the run created no niki/* branch."
            git -C "$PROJ" branch
            exit 1
          fi
          git -C "$PROJ" rev-parse --verify --quiet "refs/heads/$BRANCH"
          echo "ok: branch $BRANCH exists"

          # 2. Locate the task dir and require the evidence files.
          TASKDIR="$(find "$PROJ/.niki/tasks" -maxdepth 1 -mindepth 1 -type d | head -1)"
          if [ -z "$TASKDIR" ]; then
            echo "FAIL: no task directory under $PROJ/.niki/tasks"
            exit 1
          fi
          echo "=== .niki artifacts under $TASKDIR ==="
          find "$TASKDIR" -type f | sort

          for f in changes.patch report.md task.json; do
            if [ ! -s "$TASKDIR/$f" ]; then
              echo "FAIL: $TASKDIR/$f is missing or empty"
              exit 1
            fi
          done
          echo "ok: changes.patch, report.md and task.json are present and non-empty"

          if ! grep -q 'diff --git' "$TASKDIR/changes.patch"; then
            echo "FAIL: changes.patch contains no unified diff"
            cat "$TASKDIR/changes.patch"
            exit 1
          fi
          echo "ok: changes.patch is a unified diff"

          # 3. INV-BRANCH-STATUS: a Completed record must name a branch that
          #    resolves. This is the assertion the old echo-only step omitted.
          python3 - "$TASKDIR/task.json" "$BRANCH" <<'PY'
          import json, sys
          rec = json.load(open(sys.argv[1]))
          status = str(rec.get("status", ""))
          branch = rec.get("branch")
          print(f"task.json status={status!r} branch={branch!r}")
          if "Completed" in status:
              if not branch:
                  sys.exit("FAIL: task.json says Completed but records no branch")
              if branch != sys.argv[2]:
                  sys.exit(f"FAIL: task.json branch {branch!r} != created branch {sys.argv[2]!r}")
          elif branch is not None:
              sys.exit(f"FAIL: non-Completed run records a branch: {branch!r}")
          print("ok: branch status and recorded branch agree")
          PY

          echo "=== Report ==="
          cat "$TASKDIR/report.md"

      - name: Cleanup mock server
        if: always()
        run: |
          kill $(cat /tmp/mock_pid 2>/dev/null) 2>/dev/null || true
