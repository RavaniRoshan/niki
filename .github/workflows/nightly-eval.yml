# Nightly eval regression gate — keyless, deterministic, always on.
#
# Runs NIKI's seeded-defect eval harness in replay mode (no API keys, no cost)
# and uploads the report + disclosure manifest. `niki eval` already exits
# non-zero on expected-caught regressions, so a red run here means the
# pipeline regressed — not that a model had a bad day.
name: Nightly eval and adversarial gate

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── The canary gate ────────────────────────────────────────────────
  # Injects one known defect at a time and checks the suite notices. The
  # held-out rate is the honest number; a harness that only reported an
  # in-sample rate would be flattering itself.
  canary:
    name: Canary kill-rate gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the canary gate
        run: ./scripts/canary-gate.sh
      - name: Upload the canary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canary-results
          path: canaries/results.json
          retention-days: 30

  # ── Consumer journeys ──────────────────────────────────────────────
  # The real binary on a throwaway HOME. A journey that cannot run is a
  # failure unless it is explicitly allow-listed, because this repo has
  # shipped CI jobs that passed while executing nothing.
  journeys-nightly:
    name: Consumer journeys
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Run consumer journeys
        run: cargo test --test journeys --verbose -- --nocapture --test-threads=1

  # ── Differential: the two backends are one contract ──────────────
  # Where the worktree and container backends disagree, at least one is
  # wrong, and the pair says which. Needs the pre-built sandbox image: a
  # bare ubuntu:24.04 lacks git, node and python3 and fails the tool
  # check, so the test skips rather than passing vacuously.
  differential:
    name: Backend differential
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the sandbox image
        run: podman build -t niki-sandbox:24.04 -f docker/Dockerfile .
      - name: Build release binary
        run: cargo build --release
      - name: Compare the worktree and container backends
        run: cargo test --test differential --verbose -- --nocapture --test-threads=1

  # ── Coverage, as a report and never as a gate ─────────────────────
  # Coverage is a reachability lower bound: it says which lines ran, not
  # whether anything was asserted about them. It is published because it is
  # useful, and not gated because an integer threshold is a false signal —
  # crossing it by 0.01% is the same as crossing it by 10.
  coverage:
    name: Coverage report
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --lib --summary-only
      - name: Generate an HTML report
        run: cargo llvm-cov --lib --html --output-path target/llvm-cov
      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov
          retention-days: 14

  # The price table is a frozen snapshot of vendor rates and it will rot. It
  # used to be enforced by an unconditional wall-clock assert inside a unit
  # test, which meant `cargo test` started failing on a fixed date (2027-03-05
  # for the 0.8.0 table) whether or not anyone was watching. Staleness is now
  # reported rather than asserted, and gated here on a schedule a human sees.
  price-table:
    name: Price table freshness
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Fail if the price table is stale
        run: |
          set -euo pipefail
          cargo test --lib cost:: -- --nocapture
          python3 - <<'PY'
          import datetime, re, sys
          src = open("src/cost.rs").read()
          as_of = re.search(r'PRICE_TABLE_AS_OF: &str = "(\d{4}-\d{2}-\d{2})"', src)
          max_age = re.search(r'PRICE_TABLE_MAX_AGE_DAYS: i64 = (\d+)', src)
          if not as_of or not max_age:
              sys.exit("FAIL: could not parse price-table constants from src/cost.rs")
          age = (datetime.date.today() - datetime.date.fromisoformat(as_of.group(1))).days
          limit = int(max_age.group(1))
          print(f"price table as of {as_of.group(1)} — {age} days old (limit {limit})")
          if age > limit:
              sys.exit(
                  f"FAIL: price table is {age} days old (limit {limit}). "
                  f"Re-verify vendor rates and bump PRICE_TABLE_AS_OF in src/cost.rs."
              )
          PY

  eval-replay:
    name: Eval replay + manifest
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build debug binary
        run: cargo build
      - name: Run eval harness (replay, no keys)
        run: ./target/debug/niki eval --out .niki/eval-nightly
      - name: Verify disclosure manifest exists
        run: |
          set -euo pipefail
          test -f .niki/eval-nightly/eval-manifest.json || { echo "eval-manifest.json missing"; exit 1; }
          python3 -c "import json; m=json.load(open('.niki/eval-nightly/eval-manifest.json')); assert m['mode']=='replay', m; print('manifest ok:', m['n_cases'], 'cases,', m['niki_version'])"
      # The manifest check above only asserted `mode == 'replay'`. A run that
      # silently dropped every case still produced a valid manifest and passed.
      - name: The eval must have actually scored cases
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          m = json.load(open('.niki/eval-nightly/eval-manifest.json'))
          n = m.get('n_cases', 0)
          print(f"n_cases={n}")
          if n <= 0:
              raise SystemExit(
                  "FAIL: the eval scored zero cases. Missing or unpopulated fixtures "
                  "previously caused a silent pass; see the fixture_warnings in the report."
              )
          PY
      - name: Upload eval artifacts
        uses: actions/upload-artifact@v7
        with:
          name: eval-nightly
          path: .niki/eval-nightly/
          retention-days: 30
