name: assets

# Regenerates marketing assets (screenshots + GIFs) from the VHS tapes in
# assets/tapes/, then runs the asset linter to catch regressions.
#
# Triggers:
#   - push to main: rebuild + auto-commit the assets back to the repo
#   - pull_request: rebuild + upload as artifact for review
#   - manual: workflow_dispatch
#
# Required system tools: VHS, ttyd, ffmpeg, Python 3 + Pillow.

on:
  push:
    branches: [main]
    paths:
      - "src/display/**"
      - "assets/tapes/**"
      - "scripts/render_assets.sh"
      - "scripts/lint_assets.py"
      - ".github/workflows/assets.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "src/display/**"
      - "assets/tapes/**"
      - "scripts/**"
      - ".github/workflows/assets.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            imagemagick \
            python3-pip \
            jq
          # Pillow for the linter
          pip3 install --break-system-packages Pillow

      - name: Install VHS
        run: |
          # VHS is a single static binary. Pin to v0.10.0.
          curl -fsSL -o /tmp/vhs.tar.gz \
            https://github.com/charmbracelet/vhs/releases/download/v0.10.0/vhs_0.10.0_Linux_x86_64.tar.gz
          tar -xzf /tmp/vhs.tar.gz -C /tmp
          sudo install -m 0755 /tmp/vhs /usr/local/bin/vhs
          vhs --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Render assets
        run: bash scripts/render_assets.sh

      - name: Lint assets
        run: python3 scripts/lint_assets.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: niki-assets
          path: |
            assets/screenshots/*.png
            assets/screenshots/*.gif
            assets/*.gif
          if-no-files-found: warn

      - name: Auto-commit regenerated assets (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain assets/)" ]]; then
            git add assets/
            git commit -m "chore(assets): regenerate from VHS tapes [skip ci]"
            git push
          else
            echo "No asset changes to commit"
          fi
